services:
  web:
    build: .
    container_name: lv-test-plate-web
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST:-sauron.local}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-lv-test-plate}
      APP_PORT: ${APP_PORT:-8088}
    ports:
      - "${APP_PORT:-8088}:8088"
